<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="css/all.min.css>
<title>AnimeGo Player</title>
<style>
:root{--blue:#58afff;--blue2:#2c8de5;--panel:rgba(12,17,26,.94);--text:#fff;--muted:rgba(255,255,255,.68);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input{font:inherit}button{border:0}
#root{position:fixed;inset:0;background:#05070b}.video-stage{position:absolute;inset:0;display:grid;place-items:center;background:#05070b}.video-stage video{width:100%;height:100%;object-fit:contain;background:#05070b}
.surface{position:absolute;inset:0;background:transparent;z-index:2}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;width:68px;height:68px;border-radius:22px;background:rgba(255,255,255,.96);color:#1771bf;font-size:22px;display:grid;place-items:center;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.top{position:absolute;left:18px;right:18px;top:16px;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 12px;border-radius:18px;background:linear-gradient(180deg,rgba(5,7,11,.88),transparent)}.meta{min-width:0}.meta strong,.meta small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta strong{font-size:16px}.meta small{margin-top:4px;font-size:11px;color:var(--muted)}.top-btn{width:42px;height:42px;border-radius:14px;background:var(--panel);color:#fff;border:1px solid rgba(255,255,255,.12)}
.controls{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:76px 20px 18px;background:linear-gradient(transparent,rgba(3,6,10,.96));transition:opacity .18s}.controls.hidden,.top.hidden,.center.hidden{opacity:0;pointer-events:none}.seek{width:100%;accent-color:var(--blue);margin:0 0 10px}.bottom{display:flex;align-items:center;gap:8px}.ctrl{width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:var(--panel);color:#fff;border:1px solid rgba(255,255,255,.12)}.time{flex:1;text-align:center;font-size:12px;color:var(--muted)}.speed{min-width:58px;height:42px;padding:0 10px;border-radius:14px;background:var(--panel);color:#fff;border:1px solid rgba(255,255,255,.12);font-size:12px;font-weight:700}.notice{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;display:none;max-width:80%;padding:14px 18px;border-radius:16px;background:rgba(12,17,26,.96);color:#fff;text-align:center;font-size:13px}.notice.show{display:block}
@media (max-width:700px){.top{left:10px;right:10px;top:10px}.controls{padding-left:12px;padding-right:12px}.ctrl{width:38px;height:38px;flex-basis:38px}.center{width:60px;height:60px}}
</style>
</head>
<body>
<div id="root">
  <div class="video-stage">
    <video id="video" playsinline webkit-playsinline preload="metadata"></video>
    <button class="surface" id="surface" aria-label="Tampilkan atau sembunyikan kontrol"></button>
    <button class="center" id="center" aria-label="Putar"><i class="fa-solid fa-play"></i></button>
    <div class="top" id="top"><div class="meta"><strong id="title">AnimeGo</strong><small id="ep">Episode</small></div><button class="top-btn" id="back" aria-label="Kembali"><i class="fa-solid fa-arrow-left"></i></button></div>
    <div class="controls" id="controls">
      <input class="seek" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Posisi video">
      <div class="bottom">
        <button class="ctrl" id="backward" aria-label="Mundur 10 detik"><i class="fa-solid fa-backward-step"></i></button>
        <button class="ctrl" id="play" aria-label="Putar atau jeda"><i class="fa-solid fa-play"></i></button>
        <div class="time"><span id="now">00:00</span> / <span id="total">00:00</span></div>
        <button class="ctrl" id="mute" aria-label="Senyapkan"><i class="fa-solid fa-volume-high"></i></button>
        <button class="ctrl" id="forward" aria-label="Maju 10 detik"><i class="fa-solid fa-forward-step"></i></button>
        <button class="speed" id="speed" aria-label="Kecepatan pemutaran">1×</button>
      </div>
    </div>
    <div class="notice" id="notice"></div>
  </div>
</div>
<script>
(function(){'use strict';
var v=document.getElementById('video'), surface=document.getElementById('surface'), center=document.getElementById('center'), controls=document.getElementById('controls'), top=document.getElementById('top'), seek=document.getElementById('seek'), now=document.getElementById('now'), total=document.getElementById('total'), play=document.getElementById('play'), mute=document.getElementById('mute'), speed=document.getElementById('speed'), notice=document.getElementById('notice'), hideTimer=null, rates=[0.75,1,1.25,1.5,2], rateIndex=1;
function icon(cls){return '<i class="fa-solid fa-'+cls+'"></i>';}
function clock(x){var s=Math.max(0,Math.floor(Number(x)||0)),m=Math.floor(s/60);s%=60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function update(){var d=Number(v.duration)||0,p=Number(v.currentTime)||0;now.textContent=clock(p);total.textContent=clock(d);seek.value=d?String(Math.round(p/d*1000)):'0';}
function setIcons(){play.innerHTML=icon(v.paused?'play':'pause');center.innerHTML=icon(v.paused?'play':'pause');center.classList.toggle('hidden',!v.paused);mute.innerHTML=icon(v.muted?'volume-xmark':'volume-high');}
function show(){controls.classList.remove('hidden');top.classList.remove('hidden');if(!v.paused){clearTimeout(hideTimer);hideTimer=setTimeout(function(){if(!v.paused){controls.classList.add('hidden');top.classList.add('hidden');}},2700);}}
function hide(){if(!v.paused){controls.classList.add('hidden');top.classList.add('hidden');}}
function toggle(){if(controls.classList.contains('hidden'))show();else if(!v.paused)hide();else show();}
function togglePlay(){if(v.paused)v.play().catch(function(){showNotice('Pemutaran tidak dapat dimulai.');});else v.pause();setIcons();show();}
function skip(s){try{v.currentTime=Math.max(0,Math.min(v.duration||Infinity,v.currentTime+s));}catch(e){}show();}
function showNotice(t){notice.textContent=t;notice.classList.add('show');setTimeout(function(){notice.classList.remove('show');},1800);}
function report(exit){if(!window.LandscapeBridge)return;try{LandscapeBridge.save(v.currentTime||0,v.duration||0);}catch(e){}if(exit){try{LandscapeBridge.exit(v.currentTime||0,v.duration||0,v.playbackRate||1,!!(!v.paused),!!v.muted);}catch(e){}}}
window.__landscapeInit=function(src,t,e,pos,dur,rate,muted,autoplay){document.getElementById('title').textContent=t||'AnimeGo';document.getElementById('ep').textContent='Episode '+(e||'');v.src=src||'';v.playbackRate=Number(rate)||1;v.muted=!!muted;for(var i=0;i<rates.length;i++)if(Math.abs(rates[i]-v.playbackRate)<0.01)rateIndex=i;speed.textContent=String(rates[rateIndex]).replace('.',',')+'×';v.addEventListener('loadedmetadata',function(){try{v.currentTime=Math.min(Number(pos)||0,Math.max(0,v.duration-1));}catch(x){}update();setIcons();if(autoplay)v.play().catch(function(){});show();});v.addEventListener('timeupdate',update);v.addEventListener('play',function(){setIcons();show();});v.addEventListener('pause',function(){setIcons();show();report(false);});v.addEventListener('volumechange',setIcons);v.addEventListener('error',function(){showNotice('Video tidak dapat diputar.');});update();setIcons();};
window.__landscapeExit=function(){report(true);};
window.__landscapeSnapshot=function(){report(false);};
surface.onclick=function(){toggle();};center.onclick=function(e){e.stopPropagation();togglePlay();};play.onclick=function(e){e.stopPropagation();togglePlay();};mute.onclick=function(e){e.stopPropagation();v.muted=!v.muted;setIcons();show();};document.getElementById('backward').onclick=function(e){e.stopPropagation();skip(-10);};document.getElementById('forward').onclick=function(e){e.stopPropagation();skip(10);};seek.oninput=function(e){e.stopPropagation();if(v.duration>0)v.currentTime=Number(this.value)/1000*v.duration;show();};speed.onclick=function(e){e.stopPropagation();rateIndex=(rateIndex+1)%rates.length;v.playbackRate=rates[rateIndex];speed.textContent=String(rates[rateIndex]).replace('.',',')+'×';show();};document.getElementById('back').onclick=function(e){e.stopPropagation();report(true);};document.addEventListener('visibilitychange',function(){if(document.hidden)report(false);});})();
</script>
</body>
</html>
